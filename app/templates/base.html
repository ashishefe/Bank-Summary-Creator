<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bank Summary Creator{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="brand">
                <span class="brand-mark">BSC</span>
                <div>
                    <h1>Bank Summary Creator</h1>
                    <p class="brand-subtitle">Fast statement intelligence for Indian banks</p>
                </div>
            </div>
            <nav class="nav-links">
                <a href="/">Home</a>
                <a href="/summary">Generate Summary</a>
                <a href="/format">Add Bank Format</a>
            </nav>
        </div>
    </header>
    <main class="page">
        <div class="container">
        {% block content %}{% endblock %}
        </div>
    </main>
    {% block extra_js %}{% endblock %}
</body>
</html>
